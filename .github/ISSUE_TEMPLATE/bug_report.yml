name: Bug Report
description: Report a reproducible bug or pipeline regression.
title: "fix: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide sufficient context so we can reproduce and address it promptly.
  - type: input
    id: component
    attributes:
      label: Affected Component / Service
      description: e.g. playerhub-pipeline, playerhub-intelligence, game-map, order-tracker, pipeline-infra
      placeholder: playerhub-pipeline
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or code snippet to reproduce the behavior.
      placeholder: |
        1. Run command '...'
        2. Inspect output '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Tracebacks
      description: Paste any relevant logs or error output.
      render: shell
